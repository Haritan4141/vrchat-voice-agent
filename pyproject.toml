[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vrchat-ai-tool"
version = "0.2.0"
description = "Local voice-only VRChat assistant scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Haritan" }
]
dependencies = [
  "numpy>=1.26,<2.3",
  "psutil>=7,<8",
  "pycaw>=20251023,<20270000",
  "pywinauto>=0.6.9,<1; sys_platform == 'win32'",
  "python-osc>=1.10,<2",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
stt = [
  "faster-whisper",
]

[project.scripts]
vrchat-ai-tool = "vrchat_ai_tool.cli:main"
chatgpt-voice-doctor = "vrchat_ai_tool.cli:voice_doctor_main"
chatgpt-ui-diagnostic = "vrchat_ai_tool.cli:chatgpt_ui_diagnostic_main"
chatgpt-voice-prompt = "vrchat_ai_tool.cli:chatgpt_voice_prompt_main"
vrchat-voice-control = "vrchat_ai_tool.cli:voice_control_main"

[tool.hatch.build.targets.wheel]
packages = ["vrchat_ai_tool"]

[tool.ruff]
line-length = 100
target-version = "py310"
