[audio]
# Windows/VRChat/ChatGPTで設定した4つの端点。Inputは再生、Outputは録音です。
vrchat_output = "CABLE-A Input"
chatgpt_input = "CABLE-A Output"
chatgpt_output = "CABLE-B Input"
vrchat_microphone = "CABLE-B Output"
sample_rate = 48000
channels = 1
chunk_ms = 100

[processes]
chatgpt = "ChatGPT.exe"
vrchat = "VRChat.exe"
parsec = "parsecd.exe,parsec.exe"
forbidden = "ollama.exe,voicevox.exe"

[osc]
target_host = "127.0.0.1"
input_port = 9000
listen_host = "127.0.0.1"
output_port = 9001
status_parameter = "VoiceAgentStatus"
motion_enabled_parameter = "VoiceAgentMotionEnabled"
motion_activity_parameter = "VoiceAgentActivity"
motion_energy_parameter = "VoiceAgentEnergy"
motion_gesture_parameter = "VoiceAgentGesture"
motion_expression_parameter = "VoiceAgentExpression"
thinking_parameter = "VoiceAgentThinking"
probe_parameter = "VoiceAgentOscProbe"
# VRChatの「マイクの動作」を切り替え（トグル）に合わせます。
voice_input_mode = "toggle"
mute_confirm_timeout_sec = 2.0
mute_retry_count = 2

[control]
# LAN外には公開しないでください。初回起動時にランダムなトークンを作成します。
bind_host = "0.0.0.0"
port = 18765
token_file = "control-token.txt"
# メインPCのIPだけを指定するとより安全です。空欄は同一LAN内の全IPを許可します。
allowed_client_ips = ""

[loop_guard]
enabled = true
# ループ確定時にVRChatマイクを自動ミュートします。解除は必ず手動です。
auto_mute = true
rms_threshold = 250.0
correlation_threshold = 0.95
min_consecutive_matches = 5
feature_ms = 20
comparison_window_ms = 1500
min_delay_ms = 100
max_delay_ms = 1800
# 遅すぎる偶然の一致を除外する安全上限。max_delay_msを大きくしてもこの値を超えません。
reliable_max_delay_ms = 1800
# 一致とみなす遅延の揺れ幅と、その遅延が継続すべき最低時間です。
delay_tolerance_ms = 160
min_match_duration_ms = 1500

[motion]
# CABLE-B上のChatGPT Voice音声から、待機・発話・収束と自然な仕草を制御します。
enabled = true
speech_on_rms = 350.0
speech_off_rms = 180.0
energy_floor_rms = 220.0
energy_ceiling_rms = 4000.0
attack_ms = 250
release_ms = 700
settling_ms = 550
energy_smoothing = 0.28
idle_gesture_min_sec = 8.0
idle_gesture_max_sec = 18.0
speaking_gesture_min_sec = 2.8
speaking_gesture_max_sec = 5.8
# Hold an accent value long enough for VRChat Playable parameter sync.
gesture_sync_hold_sec = 1.5
# 発話中の顔表情を、直前と重ならないよう2〜4秒ごとに切り替えます。
speaking_expression_min_sec = 2.0
speaking_expression_max_sec = 4.0

[ui_monitor]
# ChatGPTのアクセシビリティUIを読み取り、処理中だけVoiceAgentThinkingをONにします。
enabled = true
# VRChatが前面でも、背面・最小化されたChatGPTの状態要素を読み取ります。
include_offscreen = true
interval_sec = 0.75
# UI再描画による短い消失と、完了直後の表示ちらつきを吸収します。
release_hold_sec = 2.5
search_hold_sec = 3.0

[parsec]
require_admin_mute_disabled = true
# 空欄なら標準のParsec config.txt候補を確認します。
config_paths = ""
